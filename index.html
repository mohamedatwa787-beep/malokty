
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#13000d">
<title>LOVE YOU Malokty ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
    background: radial-gradient(ellipse at 50% 42%, #310019 0%, #13000d 48%, #030006 100%);
    font-family: Arial, sans-serif;
    color: white;
}

/* BACKGROUND STARS */
#stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    color: #ff4387;
    text-shadow: 0 0 12px #ff1760;
    animation: float 5s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0) scale(.8); opacity: .25; }
    50% { transform: translateY(-30px) scale(1.4); opacity: 1; }
}

/* CINEMATIC INTRO */
#introCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
    transition: opacity 1.2s ease;
}

#introCanvas.finished { opacity: 0; }

.intro-caption {
    position: fixed;
    top: 7%;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 6;
    color: #ff9cbe;
    font-size: 13px;
    letter-spacing: 5px;
    opacity: 0;
    animation: captionIn 1.5s ease .5s forwards;
    transition: opacity 1s ease;
    pointer-events: none;
}

.intro-caption.finished { opacity: 0; }

@keyframes captionIn {
    to { opacity: .85; }
}

/* MAIN CONTENT */
.container {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 35px 15px;
    opacity: 0;
    transform: translateY(25px);
    transition: opacity 1.5s ease, transform 1.5s ease;
    pointer-events: none;
}

body.show-main .container {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

h1 {
    color: #ff3479;
    font-size: clamp(35px, 7vw, 70px);
    font-weight: 800;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #ff1760, 0 0 30px #ff1760, 0 0 65px #ff1760;
    animation: titleGlow 2s ease-in-out infinite alternate;
}

@keyframes titleGlow {
    from { filter: brightness(.9); }
    to { filter: brightness(1.4); }
}

.title-heart {
    display: inline-block;
    color: #ff174f;
    text-shadow: 0 0 20px #ff174f;
    animation: miniBeat 1s infinite;
}

@keyframes miniBeat {
    50% { transform: scale(1.18); }
}

/* MAIN HEART */
.heart {
    position: relative;
    width: 185px;
    height: 175px;
    margin: 30px auto 18px;
    animation: heartbeat 1.5s ease-in-out infinite;
    filter: drop-shadow(0 0 15px #ff1760);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.heart svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.heart-text {
    position: absolute;
    top: 49%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.55;
    color: white;
    text-shadow: 0 0 10px #ff0055;
    pointer-events: none;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
}

/* MESSAGE */
.message {
    margin-top: 10px;
    color: #ffc0d7;
    font-size: clamp(15px, 2.5vw, 19px);
    text-shadow: 0 0 12px #ff1760;
}

.message span { color: #ff315f; }

/* BUTTONS */
button {
    margin-top: 22px;
    padding: 13px 28px;
    border: 1px solid #ff83ad;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff1760, #e90051);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px #ff1760, 0 0 35px #ff176055;
    transition: .3s ease;
}

button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 35px #ff1760;
}

button:disabled {
    opacity: .75;
    cursor: default;
}

/* SECRET MESSAGE */
#secret {
    min-height: 65px;
    max-width: 90%;
    margin: 18px auto 0;
    color: #ffb3ce;
    font-size: 17px;
    line-height: 1.8;
    text-shadow: 0 0 12px #ff1760;
    opacity: 0;
    transform: translateY(10px);
    transition: .7s ease;
}

#secret.visible {
    opacity: 1;
    transform: translateY(0);
}

.typing-cursor {
    display: inline-block;
    color: #ff397b;
    animation: blink .7s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* SPECIAL MESSAGE */
#specialButton {
    display: none;
}

#specialMessage {
    display: none;
    max-width: 90%;
    margin: 20px auto;
    padding: 20px;
    border: 1px solid #ff83ad;
    border-radius: 18px;
    background: rgba(255, 23, 96, .12);
    color: #ffd0e1;
    font-size: 16px;
    line-height: 2;
    text-shadow: 0 0 12px #ff1760;
    box-shadow: 0 0 25px #ff176055;
    white-space: pre-line;
}

#specialMessage.visible {
    display: block;
    animation: specialIn 1s ease forwards;
}

@keyframes specialIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* FLYING HEARTS */
.burst-heart {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    color: #ff397b;
    text-shadow: 0 0 15px #ff1760;
    animation: heartBurst 2.5s ease-out forwards;
}

@keyframes heartBurst {
    0% {
        opacity: 1;
        transform: translate(0, 0) scale(.4) rotate(0);
    }
    100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(1.5) rotate(40deg);
    }
}

/* EXTRA MESSAGE */
.extra-love {
    position: fixed;
    left: 50%;
    top: 20%;
    transform: translateX(-50%);
    z-index: 11;
    width: 90%;
    text-align: center;
    color: #ffd0e1;
    font-size: 17px;
    text-shadow: 0 0 15px #ff1760;
    pointer-events: none;
    animation: extraFade 2.3s ease forwards;
}

@keyframes extraFade {
    0% { opacity: 0; transform: translate(-50%, 12px); }
    20%, 75% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -12px); }
}

/* DECORATION */
.bottom-text {
    margin-top: 22px;
    color: #a94c72;
    font-size: 11px;
    letter-spacing: 3px;
}

/* MOBILE */
@media(max-width: 500px) {
    .container { padding: 25px 15px; }
    h1 { font-size: 36px; }
    .heart {
        width: 160px;
        height: 155px;
        margin: 25px auto 15px;
    }
    .heart-text { font-size: 18px; }
    .intro-caption {
        font-size: 10px;
        letter-spacing: 3px;
    }
    #secret { font-size: 15px; }
    #specialMessage { font-size: 15px; }
}

@media(max-height: 650px) {
    .container { padding-top: 18px; padding-bottom: 18px; }
    .heart {
        width: 135px;
        height: 130px;
        margin: 15px auto 10px;
    }
    button { margin-top: 15px; }
    #secret { margin-top: 10px; min-height: 45px; }
    .bottom-text { margin-top: 12px; }
}

@media(prefers-reduced-motion: reduce) {
    .star, .heart, h1, .title-heart {
        animation: none !important;
    }
}
</style>
</head>

<body>

<div id="stars"></div>
<canvas id="introCanvas"></canvas>

<div class="intro-caption" id="introCaption">
    A LITTLE LOVE STORY
</div>

<div class="container">

    <h1>
        LOVE YOU
        <span class="title-heart">❤️</span>
    </h1>

    <div class="heart" id="mainHeart" title="اضغطي على القلب ❤️">
        <svg viewBox="0 0 200 180">
            <defs>
                <linearGradient id="heartColor" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ff4388"/>
                    <stop offset="100%" stop-color="#f00055"/>
                </linearGradient>
            </defs>
            <path
                d="M100 165 C80 145 10 95 10 52
                C10 5 70 0 100 45
                C130 0 190 5 190 52
                C190 95 120 145 100 165Z"
                fill="url(#heartColor)"
                stroke="#ff91b9"
                stroke-width="3"/>
        </svg>

        <div class="heart-text">
            LOVE YOU<br>
            Malokty 
        </div>
    </div>

    <div class="message">
        You are my favorite person <span>❤️</span>
    </div>

    <button id="loveButton" onclick="showLove()">
        اضغطي هنا ❤️
    </button>

    <div id="secret">
        I LOVE YOU SO MUCH MALOKTY ❤️
        <br>
        You make my world more beautiful 💗
    </div>

    <button id="specialButton" onclick="showSpecialMessage()">
        SPECIAL MESSAGE 💌
    </button>

    <div id="specialMessage"></div>

    <div class="bottom-text">
        MADE WITH LOVE
    </div>

</div>

<script>
/* FLOATING STARS */
const stars = document.getElementById("stars");

for (let i = 0; i < 85; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.textContent = Math.random() > .5 ? "♥" : "✦";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.fontSize = (8 + Math.random() * 15) + "px";
    star.style.animationDelay = Math.random() * 5 + "s";
    star.style.animationDuration = (3 + Math.random() * 4) + "s";
    stars.appendChild(star);
}

/* CINEMATIC PARTICLE HEART */
const canvas = document.getElementById("introCanvas");
const ctx = canvas.getContext("2d");

let W, H, dpr;
let particles = [];
let startTime = null;

function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createParticles();
}

function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t));

    const scale = Math.min(W * .0085, H * .011);

    return {
        x: W / 2 + x * scale,
        y: H * .43 + y * scale
    };
}

function createParticles() {
    particles = [];

    const count = Math.min(650, Math.max(300, Math.floor(W * .38)));

    for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 2;
        const target = heartPoint(t);

        particles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            tx: target.x,
            ty: target.y,
            size: Math.random() * 1.8 + .7,
            phase: Math.random() * Math.PI * 2
        });
    }
}

function easeInOut(t) {
    return t * t * (3 - 2 * t);
}

function animateIntro(timestamp) {
    if (!startTime) startTime = timestamp;

    const elapsed = (timestamp - startTime) / 1000;
    ctx.clearRect(0, 0, W, H);

    let progress = Math.min(elapsed / 3.5, 1);
    progress = easeInOut(progress);

    particles.forEach(p => {
        const twinkle = .55 + Math.sin(elapsed * 3 + p.phase) * .35;
        const x = p.x + (p.tx - p.x) * progress;
        const y = p.y + (p.ty - p.y) * progress;

        let burst = 0;
        if (elapsed > 4.3) {
            burst = Math.min((elapsed - 4.3) * 2, 1);
        }

        const dx = p.tx - W / 2;
        const dy = p.ty - H * .43;
        const finalX = x + dx * burst * .12;
        const finalY = y + dy * burst * .12;

        const fade = elapsed > 4.3
            ? Math.max(0, 1 - (elapsed - 4.3) / 1.1)
            : 1;

        ctx.beginPath();
        ctx.arc(finalX, finalY, p.size * (1 + progress * .35), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, ${45 + Math.floor(twinkle * 35)}, 130, ${twinkle * fade})`;
        ctx.shadowBlur = 7 + Math.sin(elapsed * 4 + p.phase) * 5;
        ctx.shadowColor = "#ff1760";
        ctx.fill();
    });

    ctx.shadowBlur = 0;

    if (elapsed < 5.5) {
        requestAnimationFrame(animateIntro);
    } else {
        canvas.classList.add("finished");
        document.getElementById("introCaption").classList.add("finished");
        document.body.classList.add("show-main");
    }
}

/* LOVE BUTTON */
let typingTimer = null;

function showLove() {
    const secret = document.getElementById("secret");
    const button = document.getElementById("loveButton");
    const specialButton = document.getElementById("specialButton");

    if (button.disabled) return;

    button.disabled = true;
    button.textContent = "I LOVE YOU ❤️";

    if (typingTimer) clearInterval(typingTimer);

    secret.innerHTML = "";
    secret.classList.add("visible");

    const message = "يا ملوكتي ❤️ إنتي من أجمل الحاجات اللي حصلتلي، ووجودك في حياتي بيفرق معايا جدًا. ربنا يخلي ضحكتك منورة حياتي دايمًا، ويفضل بينا كل الحب والفرحة دي. بحبك يا ملوكتي ❤️";
    const characters = Array.from(message);

    const text = document.createElement("span");
    const cursor = document.createElement("span");

    cursor.className = "typing-cursor";
    cursor.textContent = "|";

    secret.append(text, cursor);

    let index = 0;

    typingTimer = setInterval(() => {
        text.textContent += characters[index];
        index++;

        if (index >= characters.length) {
            clearInterval(typingTimer);
            typingTimer = null;
            cursor.remove();

            specialButton.style.display = "inline-block";
        }
    }, 65);

    createHeartBurst(45);
}

/* SPECIAL MESSAGE */
let specialTypingInterval;

function showSpecialMessage() {
    const special = document.getElementById("specialMessage");

    const message = `يا ملوكتي ❤️

يمكن الكلام مش دايمًا بيعرف يوصف اللي جوايا،
بس حبيت أقولك إنك شخص مميز جدًا عندي،
وإن وجودك بيخلّي تفاصيل كتير في يومي أحلى.

من وقت ما دخلتي حياتي وإنتي غيرتيها للأحسن،
وبقيتي أجمل حاجة فيها.
إنتي أول حب في حياتي، وهتفضلي حبي الوحيد،
ومش هقدر أشوف حد في جمالك ولا حنيتك
ولا حبك ليا.

هتفضلي الحاجة الوحيدة اللي منورة حياتي،
وأتمنى أشوفك دايمًا مبسوطة،
وتفضلي محققة كل اللي نفسك فيه،
وربنا يديم بينا الذكريات الحلوة.

بحبك يا ملوكتي ❤️

THIS MESSAGE IS ONLY FOR MALOKA 💌`;

    clearInterval(specialTypingInterval);

    special.textContent = "";
    special.style.display = "block";
    special.classList.remove("visible");

    void special.offsetWidth;

    special.classList.add("visible");

    const characters = Array.from(message);
    let index = 0;

    specialTypingInterval = setInterval(() => {
        special.textContent += characters[index];
        index++;

        if (index >= characters.length) {
            clearInterval(specialTypingInterval);
            createHeartBurst(35);
        }
    }, 55);
}

/* REUSABLE FLYING HEARTS */
function createHeartBurst(amount) {
    for (let i = 0; i < amount; i++) {
        setTimeout(() => {
            const heart = document.createElement("div");
            heart.className = "burst-heart";
            heart.textContent = Math.random() > .3 ? "♥" : "✦";
            heart.style.left = (35 + Math.random() * 30) + "%";
            heart.style.top = (40 + Math.random() * 25) + "%";
            heart.style.fontSize = (12 + Math.random() * 22) + "px";

            heart.style.setProperty("--x", (Math.random() - .5) * window.innerWidth + "px");
            heart.style.setProperty("--y", (Math.random() - .5) * window.innerHeight + "px");

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 2600);
        }, i * 35);
    }
}

/* CLICK THE MAIN HEART FOR SURPRISES */
const loveMessages = [
    "يا ملوكتي، ضحكتك أحلى حاجة ❤️",
    "إنتي غالية عندي أوي 💗",
    "ربنا يخليكي ليا دايمًا 🥹",
    "كل يوم وإنتي سبب في فرحتي ❤️",
    "بحب وجودك في حياتي يا ملوكتي 💖"
];

let messageIndex = 0;

document.getElementById("mainHeart").addEventListener("click", () => {
    createHeartBurst(24);

    const extra = document.createElement("div");
    extra.className = "extra-love";
    extra.textContent = loveMessages[messageIndex];

    document.body.appendChild(extra);
    setTimeout(() => extra.remove(), 2400);

    messageIndex = (messageIndex + 1) % loveMessages.length;
});

/* START */
resizeCanvas();
requestAnimationFrame(animateIntro);

window.addEventListener("resize", resizeCanvas);
</script>

</body>
</html>
